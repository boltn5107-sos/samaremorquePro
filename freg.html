<body class="font-sans antialiased bg-slate-50 text-slate-900">
    <div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="flex justify-center mb-4">
                <div class="p-3 rounded-2xl bg-primary text-accent-500">
                    <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
            </div>
            <h1 class="text-center text-3xl font-bold text-slate-900">SenegalTowing</h1>
            <p class="mt-2 text-center text-sm text-slate-600">Plateforme de remorquage et depannage routier</p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                    <form method="POST" action="http://127.0.0.1:8000/register" class="space-y-6">
        <input type="hidden" name="_token" value="GoIS7Ic0LshBO7QKGfJynwpCETguLX9PG35152Nm" autocomplete="off">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="first_name" class="block text-sm font-medium text-slate-700">Prenom</label>
                <div class="mt-1">
                    <input id="first_name" name="first_name" type="text" required value=""
                        class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
                </div>
                            </div>

            <div>
                <label for="last_name" class="block text-sm font-medium text-slate-700">Nom</label>
                <div class="mt-1">
                    <input id="last_name" name="last_name" type="text" required value=""
                        class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
                </div>
                            </div>
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
            <div class="mt-1">
                <input id="email" name="email" type="email" autocomplete="email" required value=""
                    class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
            </div>
                    </div>

        <div>
            <label for="phone" class="block text-sm font-medium text-slate-700">Telephone</label>
            <div class="mt-1">
                <input id="phone" name="phone" type="tel" required value=""
                    class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
            </div>
                    </div>

        <div>
            <label for="role" class="block text-sm font-medium text-slate-700">Je suis</label>
            <div class="mt-1">
                <select id="role" name="role" required
                    class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
                    <option value="client" >Conducteur</option>
                    <option value="remorqueur" >Remorqueur</option>
                    <option value="depanneur" >Depanneur</option>
                </select>
            </div>
                    </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-700">Mot de passe</label>
            <div class="mt-1">
                <input id="password" name="password" type="password" autocomplete="new-password" required

                    </div>

        <div>
            <label for="password_confirmation" class="block text-sm font-medium text-slate-700">Confirmer le mot de passe</label>
            <div class="mt-1">
                <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required

        </div>

        </div>
