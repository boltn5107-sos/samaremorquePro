<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Hors ligne - SenegalTowing</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            max-width: 360px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }
        .badge {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px;
        }
        p {
            font-size: 15px;
            color: #475569;
            margin: 0 0 24px;
            line-height: 1.5;
        }
        button {
            background: #f97316;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
        </div>
        <h1>Vous etes hors ligne</h1>
        <p>La connexion semble indisponible. Les fonctions en temps reel necessitent une connexion internet.</p>
        <button onclick="location.reload()">Reessayer</button>
    </div>
</body>
</html>
